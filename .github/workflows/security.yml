name: Security checks and backend image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly rebuild, so base-image (Alpine, Python) security fixes reach the published image
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  image:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Django models read data/reference_data when they are imported during the build (see
      # backend/.dockerignore), and that directory is the private spexod/data repository. DATA_REPO_TOKEN is
      # a fine-grained token with read access to the contents of spexod/data only.
      - name: Check that the DATA_REPO_TOKEN secret is set
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::The repository secret DATA_REPO_TOKEN is not set. Create a fine-grained token with" \
                 "read access to the contents of spexod/data and add it under Settings > Secrets and variables" \
                 "> Actions, then re-run this job (shell/auto_update.md, 'One-time setup on GitHub')."
            exit 1
          fi
      - name: Check out the reference data (private repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: spexod/data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: backend/data
          sparse-checkout: reference_data
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the backend image (fresh base image, no layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          platforms: linux/amd64
          pull: true
          # the same values compose.yaml passes, the Dockerfile ARGs have no defaults
          build-args: |
            MPLCONFIGDIR=/home/python_user/backend_app/.cache/matplotlib
            DATA_OUTPUT_DIR=/home/python_user/backend_app/output
          no-cache: true
          load: true
          tags: ghcr.io/spexod/backend:LATEST
      - name: Scan the image, fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/spexod/backend:LATEST
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # accepted findings with their reasons and review dates
          trivyignores: .trivyignore
      - name: Save the scanned image for the publish job
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker save ghcr.io/spexod/backend:LATEST | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  # Publishing happens only on the weekly schedule or by hand, from main, and in a job of its own: the
  # third-party actions above never run with a token that can write to the registry. The server
  # pulls LATEST the next night (shell/auto-deploy.sh).
  publish:
    needs: image
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-image
      - run: docker load < backend-image.tar.gz
      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image, also under the commit's tag
        run: |
          docker tag ghcr.io/spexod/backend:LATEST ghcr.io/spexod/backend:sha-${GITHUB_SHA::12}
          docker push ghcr.io/spexod/backend:LATEST
          docker push ghcr.io/spexod/backend:sha-${GITHUB_SHA::12}
