name: Security checks and backend image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly rebuild, so base-image (Alpine, Python) security fixes reach the published image
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Python line is declared once, as the default of BACKEND_BASE_IMAGE in compose.yaml; the runner
      # gets the same line for the lock refresh and the audit
      - name: Read the Python line from compose.yaml
        id: lines
        run: |
          python=$(sed -n 's/.*BACKEND_BASE_IMAGE:-python:\([0-9.]*\)-alpine.*/\1/p' compose.yaml | head -1)
          [ -n "$python" ] || { echo "::error::BACKEND_BASE_IMAGE's default in compose.yaml is not python:<line>-alpine"; exit 1; }
          echo "python=$python" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.lines.outputs.python }}
      # the exact versions this run builds: the base images by digest and requirements.lock, compiled inside
      # the backend's base image (the version policy in shell/next_round_plan.md: packages follow the newest
      # release, the runtimes are pinned to a line)
      - name: Resolve the versions to build
        run: python3 shell/refresh_versions.py --no-npm
      - name: Audit the resolved Python packages for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --no-deps -r backend/requirements.lock
      - name: Keep the resolved versions with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions
          path: |
            versions.env
            backend/requirements.lock
          retention-days: 90

  image:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Django models read data/reference_data when they are imported during the build (see
      # backend/.dockerignore), and that directory is the private spexod/data repository. DATA_REPO_TOKEN is
      # a fine-grained token with read access to the contents of spexod/data only.
      - name: Check that the DATA_REPO_TOKEN secret is set
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::The repository secret DATA_REPO_TOKEN is not set. Create a fine-grained token with" \
                 "read access to the contents of spexod/data and add it under Settings > Secrets and variables" \
                 "> Actions, then re-run this job (shell/auto_update.md, 'One-time setup on GitHub')."
            exit 1
          fi
      - name: Check out the reference data (private repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spexod/data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: backend/data
          sparse-checkout: reference_data
      - name: Fetch the resolved versions from the audit job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: versions
          path: .
      - name: Read the resolved versions
        run: grep -v '^#' versions.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # the build the server-side scripts run: docker buildx bake against compose.yaml (shell/build.sh), so
      # the context, the build arguments, the platform and the image name have one definition. Bake
      # interpolates the whole compose file, whose run-time section requires MYSQL_PASSWORD; the build
      # itself never sees the value
      - name: Build the backend image from the resolved versions (no layer cache)
        env:
          MYSQL_PASSWORD: not-used-by-the-build
        run: |
          ./shell/build.sh backend --no-cache \
            --set "backend.labels.org.opencontainers.image.revision=$GITHUB_SHA" \
            --set "backend.labels.org.spexodisks.base-image=$BACKEND_BASE_IMAGE"
      - name: Scan the image, fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/spexod/backend:LATEST
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # accepted findings with their reasons and review dates
          trivyignores: .trivyignore
      - name: Save the scanned image for the publish job
        if: github.event_name != 'pull_request'
        run: docker save ghcr.io/spexod/backend:LATEST | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

  # Publishing happens from main only (a push, the weekly schedule, a manual run), in a job of its own:
  # the third-party actions above never run with a token that can write to the registry. The server
  # pulls LATEST the next night (shell/auto-deploy.sh), so a merge to main is a deployment.
  publish:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
      - run: docker load < backend-image.tar.gz
      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image, also under the commit's tag
        run: |
          docker tag ghcr.io/spexod/backend:LATEST ghcr.io/spexod/backend:sha-${GITHUB_SHA::12}
          docker push ghcr.io/spexod/backend:LATEST
          docker push ghcr.io/spexod/backend:sha-${GITHUB_SHA::12}
