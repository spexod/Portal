name: Security checks and backend image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly rebuild, so base-image (Alpine, Python) security fixes reach the published image
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  image:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image (fresh base image, no layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: ghcr.io/spexod/backend:LATEST
      - name: Scan the image, fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/spexod/backend:LATEST
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Publishing only on the weekly schedule or by hand, never on a push: the server pulls LATEST.
      - name: Log in to the container registry
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker push ghcr.io/spexod/backend:LATEST
